version: 2
build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
  jobs:
    # Install exactly what's in uv.lock, same as CI
    # https://docs.readthedocs.com/platform/stable/build-customization.html#install-dependencies-with-uv
    # uv comes from PyPI, because installing it with asdf resolves "latest"
    # through GitHub, which fails intermittently on Read the Docs. The reshim
    # puts the uv command on PATH, so it works even after the venv activates.
    pre_create_environment:
      - python -m pip install uv
      - asdf reshim python
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --no-dev
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
